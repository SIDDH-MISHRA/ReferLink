<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('rl-theme')||'dark'}catch(e){document.documentElement.dataset.theme='dark'}document.documentElement.classList.add('js')</script>
  <meta name="theme-color" content="#0a0714">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Page not found · ReferLink</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/config.js" defer></script>
  <script src="/js/app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container wide nav-pill">
      <a class="logo" href="/" aria-label="ReferLink home"><span class="logo-mark"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span>ReferLink</a>
      <button class="btn btn-ghost btn-icon theme-toggle" type="button" data-theme-toggle aria-label="Switch colour theme"><svg class="icon icon-sun"><use href="#i-sun"/></svg><svg class="icon icon-moon"><use href="#i-moon"/></svg></button>
    </div>
  </header>
  <main>
    <div class="container">
      <section class="card empty view">
        <p class="mono muted" style="font-size:0.875rem">404</p>
        <h3>Page not found</h3>
        <p>Check the link. It may have a typo or be cut off.</p>
        <a class="btn btn-primary" style="margin-top:20px" href="/">Go to ReferLink</a>
      </section>
    </div>
  </main>
</body>
</html>
